<title>Scolair Smart School — Smart Interactive LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: a quiet, deep-navy and pearl page. One idea per screen, thin hairlines, serif display type, slow motion. A single committed look, so colors are fixed rather than themed. Orange is the only accent. */
:root {
  --ink: #050B24; --ink-2: #0B1538; --ink-3: #101C4A;
  --pearl: #F3F5F9; --white: #FFFFFF; --text: #0A1030; --text-2: #565F82;
  --on-dark: #EEF1FB; --on-dark-2: #9CA7D0;
  --line: rgba(5,11,36,.14); --line-dark: rgba(238,241,251,.18);
  --orange: #F46F20; --blue: #3366FF; --green: #4DB749;
  --f-display: "Instrument Serif", "Times New Roman", serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
#app[dir="rtl"] { --f-display: "Amiri", "Times New Roman", serif; --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: hidden; max-width: 100%; }
body { margin: 0; background: var(--pearl); color: var(--text); font-family: var(--f-body); font-size: 16px; line-height: 1.75; overflow-x: hidden; }
#app { font-family: var(--f-body); overflow-x: clip; max-width: 100vw; }
.cms-off { display: none !important; }
.hint { font-size: 13.5px; color: var(--on-dark-2); max-width: 520px; line-height: 1.6; margin-top: 4px; }
.final .hint { text-align: center; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2 { font-family: var(--f-display); font-weight: 400; line-height: 1.06; text-wrap: balance; }
h3 { font-weight: 600; line-height: 1.3; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.wrap { max-width: 1160px; margin-inline: auto; padding-inline: 64px 20px; position: relative; }
.bar .wrap, footer .wrap { padding-inline: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
em { font-style: normal; color: var(--orange); }
#app[dir="ltr"] em { font-style: italic; }
.eb { display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--orange); }
.eb::before { content: ""; width: 44px; height: 1px; background: currentColor; flex: none; }
#app[dir="rtl"] .eb, #app[dir="rtl"] .nav a, #app[dir="rtl"] .lbl { letter-spacing: 0; text-transform: none; font-size: 13.5px; }
.h2 { font-size: clamp(2.2rem, 4.8vw, 4rem); }
.lead { font-size: 1.08rem; color: var(--text-2); max-width: 58ch; }
.dark .lead { color: var(--on-dark-2); }
.sec { padding-block: 130px; position: relative; }
.dark { background: var(--ink); color: var(--on-dark); }
.dark.alt { background: var(--ink-2); }
.head { display: flex; flex-direction: column; gap: 22px; margin-bottom: 64px; max-width: 760px; }
.rv { transform: translateY(22px); transition: transform 1.1s cubic-bezier(.2,.7,.2,1); }
.rv.in { transform: none; }

/* header */
.progress { position: fixed; top: env(safe-area-inset-top, 0px); inset-inline: 0; height: 2px; z-index: 50; background: var(--orange); transform-origin: left; transform: scaleX(0); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(5,11,36,.9); backdrop-filter: blur(12px); color: var(--on-dark); border-bottom: 1px solid var(--line-dark); }
.bar .wrap { display: flex; align-items: center; gap: 22px; padding-block: 14px; }
.brand { display: flex; align-items: center; text-decoration: none; flex: none; }
.brand .word { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -.02em; line-height: 1; }
.nav { display: flex; gap: 6px; margin-inline-start: auto; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { white-space: nowrap; text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; padding: 8px 12px; color: var(--on-dark-2); transition: color .3s; }
.nav a:hover { color: var(--on-dark); }
.lang { display: flex; border: 1px solid var(--line-dark); border-radius: 99px; flex: none; }
.lang button { background: none; border: 0; padding: 5px 14px; font-size: 12px; font-weight: 600; color: var(--on-dark-2); border-radius: 99px; }
.lang button[aria-pressed="true"] { background: var(--on-dark); color: var(--ink); }
button { background: none; color: inherit; font-family: inherit; }
.btn { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; letter-spacing: .04em; padding: 15px 28px; border-radius: 99px; text-decoration: none; border: 1px solid transparent; transition: background .4s, color .4s, border-color .4s; }
.btn.light { background: var(--on-dark); color: var(--ink); }
.btn.light:hover { background: var(--orange); color: #fff; }
.btn.solid { background: var(--ink); color: #fff; }
.btn.solid:hover { background: var(--orange); }
.btn.line { border-color: var(--line-dark); color: var(--on-dark); }
.btn.line:hover { border-color: var(--on-dark); }
.btn.dline { border-color: var(--line); color: var(--text); }
.btn.dline:hover { border-color: var(--text); }
.btn .arr { display: inline-block; transition: transform .4s; }
.btn:hover .arr { transform: translateX(4px); }
#app[dir="rtl"] .btn .arr { transform: scaleX(-1); }
#app[dir="rtl"] .btn:hover .arr { transform: scaleX(-1) translateX(4px); }
.bar .btn { padding: 9px 20px; font-size: 13px; flex: none; }

/* hero */
.hero { position: relative; background: radial-gradient(900px 560px at var(--mx, 72%) var(--my, 18%), rgba(51,102,255,.22), transparent 62%), var(--ink); color: var(--on-dark); overflow: hidden; }
.hero .wrap { z-index: 1; display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: 56px; align-items: center; padding-block: 110px 100px; }
.hero h1 { font-size: clamp(3rem, 6.6vw, 6rem); margin: 26px 0 28px; }
.hero .lead { margin-bottom: 40px; font-size: 1.15rem; color: var(--on-dark-2); }
.cta-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.frame { position: relative; padding: 12px; border: 1px solid var(--line-dark); border-radius: 4px; }
.frame .pic { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--ink-2); }
.frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; filter: grayscale(1) contrast(1.05) brightness(.95); display: block; animation: zoom 30s ease-in-out infinite alternate; }
@keyframes zoom { from { transform: scale(1.02); } to { transform: scale(1.12); } }
.frame .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,11,36,.1), rgba(5,11,36,.72)); }
.float { position: absolute; z-index: 3; inset-inline-start: -34px; bottom: 44px; background: rgba(16,28,74,.82); backdrop-filter: blur(10px); border: 1px solid var(--line-dark); border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 232px; animation: drift 9s ease-in-out infinite; }
.float b { font-weight: 600; font-size: 15px; }
.float span { font-size: 12px; color: var(--on-dark-2); }
.float .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-inline-end: 8px; animation: breathe 3s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes breathe { 50% { opacity: .35; } }
.strip { border-top: 1px solid var(--line-dark); position: relative; z-index: 1; }
.strip .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-block: 0; }
.strip .it { padding: 30px 22px; border-inline-start: 1px solid var(--line-dark); display: flex; flex-direction: column; gap: 4px; }
.strip .it:first-child { border-inline-start: 0; padding-inline-start: 0; }
.strip b { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; line-height: 1.2; }
.strip span { font-size: 13px; color: var(--on-dark-2); }

/* manifesto */
.manifesto .big { font-family: var(--f-display); font-size: clamp(2rem, 4.6vw, 3.9rem); line-height: 1.12; max-width: 24ch; text-wrap: balance; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; margin-top: 80px; }
.three > div { border-top: 1px solid var(--line); padding-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.three b { font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; color: var(--orange); }
.three p { color: var(--text-2); }

/* pillars */
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.pc { background: var(--white); border: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.2,.7,.2,1), border-color .4s; min-width: 0; }
.pc:hover { transform: translateY(-8px); border-color: var(--text); }
.pv { position: relative; height: 190px; background: var(--ink); overflow: hidden; }
.pv img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); display: block; transition: transform 1.6s ease; }
.pc:hover .pv img { transform: scale(1.08); }
.pv.ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,11,36,.1), rgba(5,11,36,.6)); }
.pv svg { width: 100%; height: 100%; display: block; }
.pb { padding: 26px 24px 28px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.pb .no { font-family: var(--f-display); color: var(--orange); font-size: 1rem; }
.pb h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
.pb p { color: var(--text-2); font-size: 15px; line-height: 1.7; }
.pb ul { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.pb li { font-size: 14px; padding-inline-start: 16px; position: relative; line-height: 1.55; }
.pb li::before { content: ""; position: absolute; inset-inline-start: 0; top: .7em; width: 6px; height: 1px; background: var(--orange); }
.route { stroke-dasharray: 5 7; animation: dashrun 3s linear infinite; }
.pulse { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 4s ease-in-out infinite; }
@keyframes dashrun { to { stroke-dashoffset: -24; } }
@keyframes draw { 0% { stroke-dashoffset: 340; } 55%, 100% { stroke-dashoffset: 0; } }

/* day */
.day { overflow: hidden; }
.day .bg { position: absolute; inset: 0; opacity: .22; }
.day .bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); opacity: 0; transition: opacity 1.4s ease; }
.day .bg img.on { opacity: 1; }
.day .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--ink-2) 8%, rgba(11,21,56,.55)); }
.day .wrap { z-index: 1; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 56px; align-items: center; }
.clock { font-family: var(--f-display); font-size: clamp(4.4rem, 11vw, 9rem); line-height: .95; color: var(--on-dark); font-variant-numeric: tabular-nums; direction: ltr; text-align: start; }
.clock small { font-family: var(--f-body); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--on-dark-2); display: block; margin-top: 12px; }
#app[dir="rtl"] .clock small { letter-spacing: 0; text-transform: none; font-size: 13px; }
.dgrid h3 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.8rem, 3.4vw, 2.6rem); margin: 26px 0 12px; }
.dgrid .desc { color: var(--on-dark-2); max-width: 46ch; }
.pcard { background: rgba(16,28,74,.8); backdrop-filter: blur(12px); border: 1px solid var(--line-dark); border-radius: 28px; padding: 22px; max-width: 360px; margin-inline: auto; width: 100%; }
.pcard .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--on-dark-2); letter-spacing: .08em; padding-bottom: 14px; border-bottom: 1px solid var(--line-dark); }
.pcard .nt { margin-top: 18px; background: rgba(238,241,251,.08); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; animation: rise .8s cubic-bezier(.2,.7,.2,1); }
@keyframes rise { from { transform: translateY(16px); } to { transform: none; } }
.pcard .nt span { font-size: 11px; color: var(--orange); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.pcard .nt p { font-size: 15px; line-height: 1.6; }
.pcard .ghost { margin-top: 12px; height: 54px; border-radius: 16px; background: rgba(238,241,251,.04); }
.wavewrap { margin-top: 64px; }
.wave { position: relative; }
.wsvg { display: block; width: 100%; height: 120px; overflow: visible; }
#app[dir="rtl"] .wsvg { transform: scaleX(-1); }
.wb { fill: none; stroke: var(--line-dark); stroke-width: 1.5; stroke-dasharray: 3 7; vector-effect: non-scaling-stroke; }
.wl { fill: none; stroke: url(#gflow); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.wdots { position: absolute; inset: 0 0 auto 0; height: 120px; }
.wd { position: absolute; width: 13px; height: 13px; margin-top: -6.5px; margin-inline-start: -6.5px; border-radius: 50%; background: var(--ink-2); border: 1px solid var(--on-dark-2); transition: background .4s, border-color .4s; }
.wd.past { border-color: var(--orange); background: var(--orange); }
.worb { position: absolute; width: 22px; height: 22px; margin-top: -11px; margin-inline-start: -11px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgba(244,111,32,.35), 0 0 28px 8px rgba(244,111,32,.55); }
.wlabels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 18px; }
.mo { background: none; border: 0; padding: 8px 6px; text-align: center; color: var(--on-dark-2); font-size: 13px; line-height: 1.35; transition: color .4s; }
.mo[aria-selected="true"] { color: var(--on-dark); }
.mo b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; }
.dctl { margin-top: 44px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.dctl .note { font-size: 12px; color: var(--on-dark-2); }

/* trust */
.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 48px; }
.pr { border-top: 1px solid var(--line-dark); padding: 28px 0 40px; display: flex; flex-direction: column; gap: 12px; }
.pr b { font-family: var(--f-display); font-weight: 400; font-size: 1rem; color: var(--orange); }
.pr h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; }
.pr p { color: var(--on-dark-2); font-size: 15px; }
.quote { font-family: var(--f-display); font-size: clamp(1.9rem, 4vw, 3.2rem); line-height: 1.15; max-width: 22ch; margin-top: 50px; }

/* proof */
.targets { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.tg { padding: 34px 22px 10px; border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.tg:first-child { border-inline-start: 0; padding-inline-start: 0; }
.tg b { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.4rem, 4.4vw, 3.8rem); line-height: 1; direction: ltr; text-align: start; }
.tg span { font-size: 14px; color: var(--text-2); line-height: 1.5; }
.pnote { margin-top: 34px; font-size: 14px; color: var(--text-2); display: flex; gap: 12px; align-items: center; }
.pnote::before { content: ""; width: 8px; height: 8px; background: var(--orange); border-radius: 50%; flex: none; }

/* standard */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px; position: relative; }
.steps::before { content: ""; position: absolute; inset-inline: 0; top: 6px; height: 1px; background: var(--line); }
.sp { position: relative; padding-top: 38px; display: flex; flex-direction: column; gap: 12px; }
.sp::before { content: ""; position: absolute; top: 0; inset-inline-start: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--orange); }
.sp h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; }
.sp p { color: var(--text-2); font-size: 15px; }

/* programmes */
.progs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.pg { background: var(--pearl); border: 1px solid var(--line); padding: 40px 32px 34px; display: flex; flex-direction: column; gap: 20px; position: relative; min-width: 0; }
.pg.feat { background: var(--ink); color: var(--on-dark); border-color: var(--ink); }
.pg.feat::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 3px; background: var(--orange); }
.pg .tag { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--orange); min-height: 18px; }
#app[dir="rtl"] .pg .tag { letter-spacing: 0; text-transform: none; font-size: 13px; }
.pg h3 { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; line-height: 1.05; }
.pg .inc { font-size: 13px; color: var(--text-2); }
.pg.feat .inc { color: var(--on-dark-2); }
.pg ul { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.pg li { font-size: 15px; padding-inline-start: 20px; position: relative; line-height: 1.55; }
.pg li::before { content: ""; position: absolute; inset-inline-start: 0; top: .7em; width: 9px; height: 1px; background: var(--orange); }
.pg .price { font-family: var(--f-display); font-size: 1.4rem; padding-top: 20px; border-top: 1px solid var(--line); }
.pg.feat .price { border-color: var(--line-dark); }

/* faq */
.faq { max-width: 860px; }
details { border-top: 1px solid var(--line); }
details:last-child { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 26px 0; display: flex; justify-content: space-between; gap: 20px; font-family: var(--f-display); font-size: 1.5rem; line-height: 1.25; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--orange); font-size: 1.8rem; line-height: 1; transition: transform .4s; flex: none; }
details[open] summary::after { transform: rotate(45deg); }
details p { padding-bottom: 28px; color: var(--text-2); max-width: 62ch; }

/* final cta */
.final { overflow: hidden; text-align: center; }
.final .wm { position: absolute; width: min(520px, 80vw); left: 50%; top: 50%; translate: -50% -50%; opacity: .06; pointer-events: none; }
.final .wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.final h2 { font-size: clamp(2.6rem, 6.4vw, 5.4rem); max-width: 16ch; }
.final .eb { justify-content: center; }
.msgbox { width: min(560px, 100%); border: 1px solid var(--line-dark); border-radius: 18px; padding: 18px 20px; font-size: 14px; color: var(--on-dark-2); text-align: start; line-height: 1.7; user-select: all; }
.copied { font-size: 13px; color: var(--green); min-height: 20px; }
footer { background: var(--ink); color: var(--on-dark-2); border-top: 1px solid var(--line-dark); }
footer .wrap { padding-block: 34px calc(34px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; font-size: 13px; }
footer .brand { color: var(--on-dark); }


/* motion flow: rail, ribbons, pipeline */
.rail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; overflow: visible; }
.rail .base { fill: none; stroke: rgba(120,132,180,.3); stroke-width: 1.5; }
.rail .live { fill: none; stroke: url(#grail); stroke-width: 3; stroke-linecap: round; }
.rail .nd { fill: var(--ink); stroke: rgba(120,132,180,.7); stroke-width: 1.5; transition: fill .5s, stroke .5s; }
.rail .nd.on { fill: var(--orange); stroke: var(--orange); }
.rail .orb { fill: #fff; stroke: var(--orange); stroke-width: 3; }
.rail .halo { fill: var(--orange); opacity: .4; filter: url(#gl); }
main { position: relative; }
.rib { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.rib path { fill: none; stroke-linecap: round; }
.rib .u { stroke: rgba(238,241,251,.08); stroke-width: 1.2; }
.rib .st { stroke: url(#gflow); stroke-width: 2.4; stroke-dasharray: 190 1750; animation: streak 9s linear infinite; }
.rib .st:nth-of-type(4) { animation-duration: 12s; animation-delay: -4s; }
.rib .st:nth-of-type(6) { animation-duration: 10s; animation-delay: -7s; }
.rib .st:nth-of-type(8) { animation-duration: 14s; animation-delay: -2s; }
@keyframes streak { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1940; } }
.hero .wrap { transform: translateY(calc(var(--p, 0) * -22px)); }

.flow .lead { margin-top: -6px; }
.fl { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 8px; }
.fl li { position: relative; list-style: none; }
.fn { width: 100%; background: none; border: 0; padding: 0 6px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; color: var(--on-dark-2); transition: color .4s; }
.fn .ic { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line-dark); background: var(--ink-3); display: grid; place-items: center; position: relative; z-index: 1; transition: transform .6s cubic-bezier(.2,.7,.2,1), border-color .4s, background .4s, box-shadow .6s; }
.fn .ic svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.fn .tx { display: flex; flex-direction: column; gap: 4px; }
.fn small { font-size: 12px; letter-spacing: .14em; color: var(--orange); font-weight: 600; direction: ltr; }
.fn .ft { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; color: var(--on-dark); font-weight: 400; }
.fn .tx > span { font-size: 13px; line-height: 1.4; }
.fl li.done .ic { border-color: var(--orange); }
.fl li.on .ic { transform: scale(1.14); background: var(--orange); border-color: var(--orange); color: #fff; box-shadow: 0 0 0 8px rgba(244,111,32,.18), 0 0 40px rgba(244,111,32,.45); }
.fl li.on .fn { color: var(--on-dark); }
.cn { position: absolute; top: 31px; inset-inline-start: calc(50% + 40px); width: calc(100% - 80px); height: 2px; background: var(--line-dark); overflow: hidden; }
.cn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; inset-inline-start: -45%; background: linear-gradient(90deg, transparent, var(--orange), transparent); animation: cnrun 2.2s linear infinite; }
.fl li.done .cn { background: var(--orange); }
@keyframes cnrun { to { inset-inline-start: 110%; } }
.floop { position: relative; height: 54px; margin: 30px calc(100% / 12) 0; border: 1px dashed var(--line-dark); border-top: 0; border-radius: 0 0 30px 30px; }
.floop::after { content: ""; position: absolute; bottom: -5px; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 14px 3px rgba(244,111,32,.6); inset-inline-end: 0; animation: loopback 6s ease-in-out infinite; }
.floop span { position: absolute; inset-inline: 0; bottom: 14px; text-align: center; font-size: 13px; color: var(--on-dark-2); }
@keyframes loopback { 0% { inset-inline-end: 0; } 100% { inset-inline-end: calc(100% - 9px); } }
.fdet { margin-top: 52px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 36px; align-items: start; border-top: 1px solid var(--line-dark); padding-top: 34px; }
.fdet .fnum { font-family: var(--f-display); font-size: clamp(3rem, 6vw, 5rem); line-height: 1; color: var(--orange); direction: ltr; font-variant-numeric: tabular-nums; }
.fdet h3 { font-family: var(--f-display); font-weight: 400; font-size: 2rem; margin-bottom: 10px; }
.fdet p { color: var(--on-dark-2); max-width: 62ch; }
.fdet .body { animation: rise .8s cubic-bezier(.2,.7,.2,1); }
.fctl { margin-top: 30px; display: flex; gap: 14px; align-items: center; }
.pillars.rv .pc { transform: translateY(34px); transition: transform .9s cubic-bezier(.2,.7,.2,1), border-color .4s; transition-delay: calc(var(--i) * .12s); }
.pillars.rv.in .pc { transform: none; }
.pillars.rv.in .pc:hover { transform: translateY(-8px); transition-delay: 0s; }
.steps::after { content: ""; position: absolute; top: 4px; height: 3px; width: 140px; inset-inline-start: -140px; background: linear-gradient(90deg, transparent, var(--orange), transparent); animation: stepsrun 5.5s linear infinite; }
@keyframes stepsrun { to { inset-inline-start: 100%; } }
@media (max-width: 760px) {
  .wrap { padding-inline: 40px 16px; }
  .fl { grid-template-columns: minmax(0, 1fr); }
  .fn { flex-direction: row; text-align: start; gap: 16px; padding: 0 0 26px; align-items: center; }
  .fn .ic { flex: none; width: 56px; height: 56px; }
  .cn { top: 60px; bottom: 0; inset-inline-start: 27px; width: 2px; height: auto; }
  .cn::after { inset: auto 0 auto 0; width: auto; height: 40%; top: -45%; animation-name: cnrunv; background: linear-gradient(180deg, transparent, var(--orange), transparent); }
  @keyframes cnrunv { to { top: 110%; } }
  .fl li:last-child .fn { padding-bottom: 0; }
  .floop { display: none; }
  .fdet { grid-template-columns: minmax(0, 1fr); gap: 14px; }
}


/* v5: logo, form, marquee, stickers, faces, tagline */
.lockup { color: var(--on-dark); display: block; width: auto; }
footer .lockup { color: var(--on-dark); }
.herologo { display: block; width: auto; color: var(--on-dark); margin-bottom: 8px; overflow: visible; }
.assemble .lgG { animation: lgdrop 1.3s cubic-bezier(.3,.9,.3,1) .25s backwards; }
.assemble .lgB { animation: lgdrop 1.3s cubic-bezier(.3,.9,.3,1) .55s backwards; }
.assemble .lgW { animation: lgslide 1.2s cubic-bezier(.2,.7,.2,1) .9s backwards; }
@keyframes lgdrop { from { transform: translateY(-420px); } }
@keyframes lgslide { from { transform: translateX(-140px); } }
.frame img.stk { position: absolute; z-index: 4; pointer-events: none; height: auto; object-fit: contain; filter: none; will-change: transform; }
.frame img.stk.s1 { width: 104px; inset-inline-end: -26px; top: -18px; animation: bob 7s ease-in-out infinite; }
.frame img.stk.s2 { width: 78px; inset-inline-end: -22px; bottom: 90px; animation: bob 9s ease-in-out -2s infinite; }
.frame img.stk.s3 { width: 96px; inset-inline-start: -28px; top: 54px; animation: bob 8s ease-in-out -4s infinite; }
@keyframes bob { 0%, 100% { translate: 0 0; rotate: -3deg; } 50% { translate: 0 -12px; rotate: 4deg; } }
.sk { position: absolute; z-index: 0; pointer-events: none; height: auto; transform: translate3d(0, calc(var(--y, 0) * 1px), 0) rotate(calc(var(--r, 0deg) + var(--rr, 0) * 1deg)); will-change: transform; }
.manifesto, #ecosystem, .faces, #proof, #programmes, #faq { overflow: hidden; }
.dr { width: 38px; height: 38px; fill: none; stroke: var(--orange); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.dr path { stroke-dasharray: 1; }
.in .dr path { animation: drw 1.8s ease-out backwards; }
@keyframes drw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.three > div > .dr, .pr > .dr, .sp > .dr, .pg > .dr { margin-bottom: 4px; }
.pg.feat .dr { stroke: var(--orange); }

/* marquee */
.mq { background: var(--pearl); border-bottom: 1px solid var(--line); overflow: hidden; direction: ltr; padding-block: 18px; display: flex; flex-direction: column; gap: 12px; }
.mq-track { display: flex; gap: 12px; width: max-content; animation: mq 46s linear infinite; }
.mq-track.rev { animation-direction: reverse; animation-duration: 54s; }
.mq:hover .mq-track { animation-play-state: paused; }
@keyframes mq { to { transform: translateX(-50%); } }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px 10px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--white); font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--text); }
.chip svg { width: 20px; height: 20px; fill: none; stroke: var(--orange); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.chip:nth-child(3n+2) svg { stroke: var(--blue); }
.chip:nth-child(3n) svg { stroke: var(--green); }

/* faces */
.fcs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; align-items: center; padding-block: 30px 40px; }
.fc { margin: 0; position: relative; transform: translate3d(0, calc(var(--y, 0) * 1px), 0); will-change: transform; }
.fc img { width: 100%; height: auto; display: block; border-radius: 3px; background: var(--white); box-shadow: 0 24px 50px -28px rgba(5,11,36,.5); }
.fc .ring { position: absolute; inset: -9px; border: 1px solid var(--orange); border-radius: 6px; opacity: .55; pointer-events: none; transform: translate(calc(var(--y, 0) * -.3px), 0); }
.fc:nth-child(2n) .ring { border-color: var(--blue); }
.fc:nth-child(3n) .ring { border-color: var(--green); }

/* tagline band */
.tband { background: var(--ink); overflow: hidden; direction: ltr; padding-block: 38px; border-top: 1px solid var(--line-dark); }
.ttrack { display: flex; gap: 40px; width: max-content; transform: translate3d(calc(var(--tx, 0) * 1px), 0, 0); will-change: transform; }
.ttrack span { font-family: "Instrument Serif", "Amiri", serif; font-size: clamp(3.4rem, 9vw, 7.4rem); line-height: 1; white-space: nowrap; color: transparent; -webkit-text-stroke: 1px rgba(238,241,251,.5); display: inline-flex; align-items: center; gap: 40px; }
.ttrack span:nth-child(3n+1) { color: var(--on-dark); -webkit-text-stroke: 0; }
.ttrack i { width: 14px; height: 14px; border-radius: 50%; background: var(--orange); flex: none; }
.ttrack span:nth-child(3n+2) i { background: var(--blue); }
.ttrack span:nth-child(3n) i { background: var(--green); }

/* final contact line */
.mailline { color: var(--on-dark-2); font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.mailline a { color: var(--on-dark); font-weight: 600; direction: ltr; }
.cp { background: none; border: 1px solid var(--line-dark); border-radius: 99px; padding: 4px 14px; font-size: 12px; color: var(--on-dark-2); }
.cp:hover { color: var(--on-dark); border-color: var(--on-dark); }

/* dialog form */
html:has(dialog[open]) { overflow: hidden; }
dialog { border: 0; padding: 0; background: transparent; width: min(700px, calc(100vw - 24px)); max-width: none; color: var(--text); font-family: var(--f-body); overflow: visible; }
dialog::backdrop { background: rgba(5,11,36,.78); backdrop-filter: blur(6px); }
.dl-box { position: relative; background: var(--pearl); border-radius: 6px; padding: 44px 40px 34px; max-height: calc(100vh - 28px); max-height: calc(100dvh - 28px); overflow: auto; border-top: 3px solid var(--orange); }
.dl-box h2 { font-size: clamp(1.9rem, 4vw, 2.7rem); margin: 14px 0 10px; }
.dl-sub { color: var(--text-2); font-size: 15px; max-width: 54ch; margin-bottom: 24px; }
.dl-x { position: absolute; inset-block-start: 12px; inset-inline-end: 14px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); font-size: 22px; line-height: 1; color: var(--text); }
.dl-x:hover { border-color: var(--text); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 13px; font-weight: 600; color: var(--text); }
.fld.full { grid-column: 1 / -1; }
.fld input, .fld select, .fld textarea { font: inherit; font-weight: 400; font-size: 15px; color: var(--text); background: var(--white); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; width: 100%; min-width: 0; }
.fld textarea { min-height: 96px; resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--orange); outline-offset: 0; border-color: transparent; }
.fld[data-bad="1"] input, .fld[data-bad="1"] select { border-color: #B42318; }
.fld .err { color: #B42318; font-weight: 500; min-height: 0; }
.fld input[dir="ltr"] { text-align: start; }
.consent { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--text-2); margin-top: 6px; }
.consent input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--orange); flex: none; }
.dl-act { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; align-items: center; }
.dl-pre { white-space: pre-wrap; word-break: break-word; background: var(--white); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; font-family: var(--f-body); font-size: 14px; line-height: 1.7; max-height: 260px; overflow: auto; margin: 0; }
.dl-ok { margin-top: 12px; font-size: 13px; color: #2E7D32; min-height: 18px; }
@media (max-width: 760px) {
  .fcs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sk { display: none; }
  .frame img.stk.s1 { width: 72px; inset-inline-end: -8px; } .frame img.stk.s2 { display: none; } .frame img.stk.s3 { width: 66px; inset-inline-start: -8px; }
  .fgrid { grid-template-columns: minmax(0, 1fr); }
  .dl-box { padding: 40px 20px 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .assemble .lgG, .assemble .lgB, .assemble .lgW, .stk, .mq-track, .in .dr path { animation: none !important; }
}


.dwgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-top: 28px; }
.dwc { display: flex; gap: 16px; align-items: flex-start; border: 1px solid var(--line, #d9deef); border-radius: 4px; padding: 22px; color: inherit; text-decoration: none; transition: transform .5s cubic-bezier(.2,.7,.2,1), border-color .3s; }
.dwc:hover { transform: translateY(-6px); border-color: var(--orange); }
.dwx { flex: none; width: 48px; height: 56px; border-radius: 6px; background: var(--ink, #0A1236); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; border-bottom: 4px solid var(--orange); }
.dwc b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; line-height: 1.2; }
.dwc small { display: block; margin-top: 6px; font-size: 13px; opacity: .7; line-height: 1.5; }
.dwc em { display: block; margin-top: 10px; font-style: normal; font-size: 12.5px; color: var(--orange); font-weight: 600; }

.cx .cxh { max-width: 820px; margin-bottom: 36px; }
.cx .cxp { max-width: 820px; display: flex; flex-direction: column; gap: 14px; font-size: 1.05rem; }
.cx.center .cxh, .cx.center .cxp { margin-inline: auto; text-align: center; }
.cx .cxm { display: grid; gap: 18px; margin-top: 34px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.cx .cxm img, .cx .cxm video { width: 100%; height: auto; border-radius: 4px; display: block; background: #0002; }
.cx .cxm .vid { position: relative; aspect-ratio: 16 / 9; }
.cx .cxm iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 4px; }
.cx .cxb { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.cx.center .cxb { justify-content: center; }
.soc { display: flex; gap: 16px; flex-wrap: wrap; }

/* v6: complete system explorer, roles */
.sys .head { margin-bottom: 40px; }
.stabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 34px; }
.stab { background: none; border: 1px solid var(--line-dark); border-radius: 99px; padding: 9px 18px; font-size: 14px; color: var(--on-dark-2); display: inline-flex; gap: 10px; align-items: center; transition: color .3s, background .3s, border-color .3s; }
.stab b { font-weight: 600; font-size: 12px; color: var(--orange); direction: ltr; }
.stab:hover { color: var(--on-dark); border-color: var(--on-dark-2); }
.stab[aria-selected="true"] { background: var(--on-dark); color: var(--ink); border-color: var(--on-dark); }
.stab[aria-selected="true"] b { color: var(--ink); }
.sgrid { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 44px; align-items: start; }
.slist { display: flex; flex-direction: column; border-top: 1px solid var(--line-dark); }
.smod { display: flex; align-items: center; gap: 16px; padding: 16px 4px; background: none; border: 0; border-bottom: 1px solid var(--line-dark); text-align: start; color: var(--on-dark-2); transition: color .3s, padding .4s cubic-bezier(.2,.7,.2,1); }
.smod svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; transition: stroke .3s; }
.smod span { font-family: var(--f-display); font-size: 1.45rem; line-height: 1.15; }
.smod:hover { color: var(--on-dark); }

.smod[aria-selected="true"] svg { stroke: var(--orange); }
.sdet { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; animation: rise .7s cubic-bezier(.2,.7,.2,1); }
.sdet h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
.sdet .tl { color: var(--on-dark-2); font-size: 15px; }
.sdet ul { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.sdet li { font-size: 14.5px; padding-inline-start: 18px; position: relative; line-height: 1.55; color: var(--on-dark); }
.sdet li::before { content: ""; position: absolute; inset-inline-start: 0; top: .72em; width: 8px; height: 1px; background: var(--orange); }
.pilot { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--green); border: 1px solid var(--green); border-radius: 99px; padding: 3px 12px; }
#app[dir="rtl"] .pilot { letter-spacing: 0; font-size: 12.5px; }
.sview { position: sticky; top: calc(88px + env(safe-area-inset-top, 0px)); }
.scap { margin-top: 12px; font-size: 12px; color: var(--on-dark-2); text-align: center; }
.scr { aspect-ratio: 16 / 10; border-radius: 14px; border: 1px solid var(--line-dark); background: linear-gradient(160deg, #101D4C, #0A1236); overflow: hidden; box-shadow: 0 40px 80px -40px rgba(0,0,0,.7), 0 0 0 1px rgba(244,111,32,.06); position: relative; }
.scr-top { display: flex; gap: 6px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line-dark); }
.scr-top i { width: 9px; height: 9px; border-radius: 50%; background: rgba(238,241,251,.22); }
.scr-top span { margin-inline-start: auto; font-size: 11px; letter-spacing: .12em; color: var(--on-dark-2); }
#app[dir="rtl"] .scr-top span { letter-spacing: 0; }
.scr-b { display: flex; gap: 12px; padding: 14px; height: calc(100% - 38px); position: relative; animation: rise .8s cubic-bezier(.2,.7,.2,1); }
.m-col { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.m-row { display: flex; gap: 9px; align-items: center; min-width: 0; }
.m-b { background: rgba(238,241,251,.07); border-radius: 10px; padding: 9px 11px; font-size: 11.5px; color: var(--on-dark); line-height: 1.4; min-width: 0; }
.m-t { font-size: 10px; color: var(--on-dark-2); letter-spacing: .08em; }
.m-l { height: 6px; border-radius: 4px; background: rgba(238,241,251,.15); margin-top: 6px; }
.w30 { width: 30%; } .w50 { width: 50%; } .w70 { width: 70%; } .w90 { width: 90%; }
.m-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line-dark); font-size: 10.5px; color: var(--on-dark-2); white-space: nowrap; }
.m-pill.o { border-color: var(--orange); color: var(--orange); } .m-pill.g { border-color: var(--green); color: var(--green); } .m-pill.bl { border-color: #7E9BFF; color: #9FB4FF; } .m-pill.r { border-color: #FF6B5B; color: #FF8E80; }
.m-bar { height: 6px; border-radius: 4px; background: rgba(238,241,251,.12); overflow: hidden; }

@keyframes mgrow { from { transform: scaleX(.3); } to { transform: scaleX(1); } }
.m-dot { width: 22px; height: 22px; border-radius: 50%; background: #1B2C6B; border: 1px solid var(--line-dark); flex: none; }
.m-btn { background: var(--orange); color: #fff; border-radius: 8px; padding: 7px 12px; font-size: 11px; font-weight: 600; text-align: center; }
.m-hl { animation: mhl 12s infinite; animation-delay: calc(var(--i) * 2s); }
@keyframes mhl { 0%, 15% { background: var(--orange); color: #fff; } 17%, 100% { background: rgba(238,241,251,.07); color: var(--on-dark); } }
.m-pop { animation: mpop 7s ease-in-out infinite; animation-delay: calc(var(--i) * .9s); }
@keyframes mpop { 0% { transform: translateY(10px) scale(.94); } 8%, 100% { transform: none; } }
.m-i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.m-play { width: 0; height: 0; border-left: 13px solid var(--on-dark); border-block: 8px solid transparent; }
.m-tl { height: 4px; background: rgba(238,241,251,.15); border-radius: 3px; position: relative; margin-top: 10px; }
.m-tl i { position: absolute; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); inset-inline-start: var(--x); animation: mpulse 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .5s); }
@keyframes mpulse { 50% { transform: scale(1.5); box-shadow: 0 0 0 5px rgba(244,111,32,.25); } }
.m-ck { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--green); color: #fff; }

.m-ck.l { background: transparent; border: 1px solid var(--line-dark); color: var(--on-dark-2); }
.m-swap { position: relative; width: 18px; height: 18px; flex: none; color: var(--on-dark-2); }
.m-swap svg { position: absolute; inset: 0; width: 18px; height: 18px; }

    return "";
  }
  function paras(t) { return String(t || "").split(/\n{2,}|\r\n\r\n/).map(function (x) { return x.trim(); }).filter(Boolean).map(function (x) { return "<p>" + esc(x).replace(/\n/g, "<br>") + "</p>"; }).join(""); }
  function renderCustom() {
    Array.prototype.forEach.call(document.querySelectorAll("section[data-cx]"), function (sec) {
      var b = null; (CMS.blocks || []).forEach(function (x) { if (x.id === sec.getAttribute("data-cx")) b = x; });
      if (!b) return;
      var L = function (o) { return o ? (o[lang] || o.ar || o.en || "") : ""; };
      var h = '<div class="wrap"><div class="cxh rv in">' + (L(b.eyebrow) ? '<div class="eb">' + esc(L(b.eyebrow)) + "</div>" : "") + (L(b.title) ? '<h2 class="h2">' + esc(L(b.title)) + "</h2>" : "") + "</div>";
      if (L(b.text)) h += '<div class="cxp">' + paras(L(b.text)) + "</div>";
      var ms = (b.media || []).map(function (m) {
        if (m.type === "image") { var s = mediaSrc(m); return s ? '<img loading="lazy" src="' + esc(s) + '" alt="' + esc(L(m.alt)) + '">' : ""; }
        if (m.type === "video") { var v = mediaSrc(m); return v ? '<video controls playsinline preload="metadata" src="' + esc(v) + '"></video>' : ""; }
        if (m.type === "embed") { var e = ytEmbed(m.src); return e ? '<div class="vid"><iframe src="' + esc(e) + '" title="video" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>' : ""; }
        return "";
      }).filter(Boolean).join("");
      if (ms) h += '<div class="cxm">' + ms + "</div>";
      var bt = (b.buttons || []).map(function (x, i) { var u = safeUrl(x.url); return u && L(x.label) ? '<a class="btn ' + (i ? "line" : (b.theme === "dark" ? "light" : "solid")) + '" href="' + esc(u) + '"' + (/^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : "") + ">" + esc(L(x.label)) + "</a>" : ""; }).join("");
      if (bt) h += '<div class="cxb">' + bt + "</div>";
      sec.innerHTML = h + "</div>";
    });
  }
  (function buildCustom() {
    (CMS.blocks || []).forEach(function (b) {
      if (!b || !/^[a-f0-9]{6,16}$/.test(b.id || "") || b.hidden) return;
      var sec = document.createElement("section");
      sec.className = "sec cx" + (b.theme === "dark" ? " dark" : "") + (b.layout === "center" ? " center" : "");
      sec.id = "cx-" + b.id; sec.setAttribute("data-cx", b.id);
      var after = b.after && b.after !== "end" ? $(b.after) : null;
      if (after && after.parentNode) after.parentNode.insertBefore(sec, after.nextSibling);
      else { var foot = document.querySelector("footer"); foot.parentNode.insertBefore(sec, foot); }
    });
    CMS_SECTION_IDS.forEach(function (id) { if (CMSH[id] && $(id)) $(id).classList.add("cms-off"); });
    if (CMSH.downloads) $("downloads").classList.add("cms-off");
  })();
  function applyImages() {
    var im = CMS.images; if (!im) return;
    Array.prototype.forEach.call(document.querySelectorAll("img"), function (el) {
      var o = el.getAttribute("data-orig") || el.getAttribute("src"); if (!o || !im[o]) return;
      var n = /^[a-f0-9]{12,32}$/.test(im[o]) ? "api/media.php?id=" + im[o] : (/^https:\/\//i.test(im[o]) ? im[o] : "");
      if (n && el.getAttribute("src") !== n) { el.setAttribute("data-orig", o); el.setAttribute("src", n); }
    });
  }
  function applySocial() {
    var f = document.querySelector("footer .wrap"), old = f.querySelector(".soc"); if (old) old.remove();
    var list = (CMS_SETTINGS.social || []).filter(function (x) { return safeUrl(x.url) && (x.label || ""); });
    if (!list.length) return;
    var d = document.createElement("div"); d.className = "soc";
    d.innerHTML = list.map(function (x) { return '<a href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener">' + esc(x.label) + "</a>"; }).join("");
    f.appendChild(d);
  }
  function applyMail() { var a = $("c_addr"); if (a) { a.textContent = MAILTO; a.setAttribute("href", "mailto:" + MAILTO); } var m = $("dl_mail"); if (m) m.setAttribute("href", "mailto:" + MAILTO); }
  var RIDS = ["manifesto", "system", "flow", "ecosystem", "roles", "faces", "day", "trust", "proof", "standard", "programmes", "faq", "final"];
  function buildRail() {
    var main = $("top"), svg = $("rail"), rtl = lang === "ar", small = window.innerWidth <= 760;
    var wr = $("manifesto").querySelector(".wrap").getBoundingClientRect(), mr = main.getBoundingClientRect();
    var off = small ? 14 : 26, amp = small ? 4 : 11;
    var x0 = rtl ? (wr.right - mr.left) - off : (wr.left - mr.left) + off, sg = rtl ? -1 : 1;
    var pts = [[x0, $("manifesto").offsetTop - 40]];
    RIDS.filter(function (id) { return !CMSH[id]; }).forEach(function (id, i) { pts.push([x0 + (i % 2 ? amp : -amp) * sg, $(id).offsetTop + (id === "final" ? 150 : 96)]); });
    var d = "M" + pts[0][0] + " " + pts[0][1], k;
    for (k = 1; k < pts.length; k++) { var m = (pts[k - 1][1] + pts[k][1]) / 2; d += "C" + pts[k - 1][0] + " " + m + " " + pts[k][0] + " " + m + " " + pts[k][0] + " " + pts[k][1]; }
    var y0 = pts[0][1], y1 = pts[pts.length - 1][1];
    svg.innerHTML = '<defs><linearGradient id="grail" gradientUnits="userSpaceOnUse" x1="0" y1="' + y0 + '" x2="0" y2="' + y1 + '"><stop offset="0" stop-color="#F46F20"/><stop offset=".5" stop-color="#3366FF"/><stop offset="1" stop-color="#4DB749"/></linearGradient></defs>' +
      '<path class="base" d="' + d + '"/><path class="live" id="rlive" d="' + d + '"/>' +
      pts.slice(1).map(function (p) { return '<circle class="nd" cx="' + p[0] + '" cy="' + p[1] + '" r="6"/>'; }).join("") +
      '<circle class="halo" id="rhalo" r="16" cx="' + x0 + '" cy="' + y0 + '"/><circle class="orb" id="rorb" r="6" cx="' + x0 + '" cy="' + y0 + '"/>';
    RS.live = $("rlive"); RS.total = RS.live.getTotalLength(); RS.pts = pts;
    RS.ys = []; RS.ls = [];
    for (k = 0; k <= 320; k++) { var l = RS.total * k / 320; RS.ls.push(l); RS.ys.push(RS.live.getPointAtLength(l).y); }
    RS.nodes = svg.querySelectorAll(".nd");
    RS.live.style.strokeDasharray = RS.total;
    railUpdate();
  }
  function railUpdate() {
    if (!RS.live) return;
    var mr = $("top").getBoundingClientRect(), y = window.innerHeight * 0.55 - mr.top, ys = RS.ys, lo = 0, hi = ys.length - 1, L;
    if (y <= ys[0]) L = 0; else if (y >= ys[hi]) L = RS.total; else {
      while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (ys[mid] <= y) lo = mid; else hi = mid; }
      L = RS.ls[lo] + (RS.ls[hi] - RS.ls[lo]) * ((y - ys[lo]) / (ys[hi] - ys[lo] || 1));
    }
    RS.live.style.strokeDashoffset = RS.total - L;
    var p = RS.live.getPointAtLength(L), o = $("rorb"), h = $("rhalo");
    o.setAttribute("cx", p.x); o.setAttribute("cy", p.y); h.setAttribute("cx", p.x); h.setAttribute("cy", p.y);
    Array.prototype.forEach.call(RS.nodes, function (n, i) { n.classList.toggle("on", RS.pts[i + 1][1] <= y); });
  }
  var rbT = 0;
  function railLater() { clearTimeout(rbT); rbT = setTimeout(buildRail, 120); }
  if ("ResizeObserver" in window) new ResizeObserver(railLater).observe($("top")); else window.addEventListener("resize", railLater);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(railLater);

  /* marquee and tagline */
  function renderBands() {
    var chips = MQ.map(function (m) { return '<span class="chip"><svg viewBox="0 0 24 24"><path d="' + IC[m[0]] + '"/></svg>' + T(m[1]) + "</span>"; }).join("");
    var half = MQ.slice().reverse().map(function (m) { return '<span class="chip"><svg viewBox="0 0 24 24"><path d="' + IC[m[0]] + '"/></svg>' + T(m[1]) + "</span>"; }).join("");
    $("mq1").innerHTML = chips + chips; $("mq2").innerHTML = half + half;
    var tg = C.tag[lang], one = tg.map(function (w) { return "<span>" + w + "<i></i></span>"; }).join("");
    $("ttrack").innerHTML = one + one + one + one;
    scrollFx();
  }
  /* contact form */
  var dlg = $("dlg"), lastReq = null;
  function fieldHtml(f) {
    var id = "f_" + f.id, lab = T(f.l), dirA = f.ltr ? ' dir="ltr"' : "", ac = f.ac ? ' autocomplete="' + f.ac + '"' : "", ctl;
    if (f.t === "select") ctl = '<select id="' + id + '" name="' + f.id + '">' + f.o.map(function (o, i) { return '<option value="' + i + '">' + T(o[0]) + "</option>"; }).join("") + "</select>";
    else if (f.t === "textarea") ctl = '<textarea id="' + id + '" name="' + f.id + '" rows="3"></textarea>';
    else ctl = '<input id="' + id + '" name="' + f.id + '" type="' + (f.t || "text") + '"' + dirA + ac + (f.req ? ' aria-required="true"' : "") + ">";
    return '<label class="fld' + (f.full ? " full" : "") + '" id="w_' + f.id + '" for="' + id + '"><span>' + lab + "</span>" + ctl + '<span class="err" id="e_' + f.id + '" role="alert"></span></label>';
  }
  function openForm(pi) {
    var F = C.form;
    $("dl_eb").textContent = T(F.eb); $("dl_t").textContent = T(F.t); $("dl_s").textContent = T(F.s); $("dl_x").textContent = "×"; $("dl_x").setAttribute("aria-label", T(F.close));
    $("dl_f").innerHTML = '<div class="fgrid">' + F.f.map(fieldHtml).join("") + '</div><p class="contact-note">' + q("Use your professional contact details. Please leave student names and records out of your request. Questions about your data?", "استخدم بيانات التواصل المهنية. يرجى عدم إدراج أسماء الطلاب أو سجلاتهم في الطلب. للاستفسار بشأن بياناتك، راسلنا.") + ' <a href="mailto:' + MAILTO + '">' + MAILTO + '</a></p><label class="consent"><input type="checkbox" id="f_consent"><span>' + T(F.consent) + '</span></label><span class="fld"><span class="err" id="e_consent" role="alert"></span></span><div class="dl-act"><button class="btn solid" type="submit">' + T(FORM_ENDPOINT ? { en: "Send my request", ar: "أرسل طلبي" } : F.submit) + ARROW + "</button></div>";
    if (pi !== undefined && pi !== "" && !isNaN(+pi)) $("f_prog").value = String(+pi + 1);
    $("dl_v1").hidden = false; $("dl_v2").hidden = true;
    if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); }
    setTimeout(function () { try { $("f_name").focus(); } catch (e) {} }, 60);
  }
  function validate() {
    var F = C.form, ok = true, first = null;
    F.f.forEach(function (f) {
      var el = $("f_" + f.id), w = $("w_" + f.id), er = $("e_" + f.id), v = (el.value || "").trim(), msg = "";
      if (f.req && !v) msg = T(F.needed);
      else if (f.id === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) msg = T(F.bademail);
      er.textContent = msg; w.setAttribute("data-bad", msg ? "1" : "0"); el.setAttribute("aria-invalid", msg ? "true" : "false");
      if (msg) { ok = false; if (!first) first = el; }
    });
    var ce = $("e_consent"); if (!$("f_consent").checked) { ce.textContent = T(F.needconsent); ok = false; if (!first) first = $("f_consent"); } else ce.textContent = "";
    if (first) first.focus();
    return ok;
  }
  function collect() {
    var F = C.form, o = {}, lb = F.labels[lang];
    F.f.forEach(function (f) { var el = $("f_" + f.id), v = (el.value || "").trim(); if (f.t === "select") v = T(f.o[+el.value][0]); o[f.id] = v; });
    var lines = [T(F.hello), ""];
    ["name", "org", "role", "prog", "email", "phone", "time", "msg"].forEach(function (k) { if (o[k]) lines.push(lb[k] + ": " + o[k]); });
    return { data: o, subject: T(F.subj) + " - " + o.org, body: lines.join("\n") };
  }
  function showReady(r) {
    var F = C.form; lastReq = r;
    $("dl_eb2").textContent = T(F.eb2); $("dl_t2").textContent = T(F.t2);
    $("dl_s2").innerHTML = T(F.s2) + '<b dir="ltr">' + MAILTO + "</b>.";
    $("dl_pre").textContent = r.subject + "\n\n" + r.body;
    $("dl_mail").textContent = T(F.mail); $("dl_copy").textContent = T(F.copy); $("dl_back").textContent = T(F.back); $("dl_ok").textContent = "";
    $("dl_mail").setAttribute("href", "mailto:" + MAILTO + "?subject=" + encodeURIComponent(r.subject) + "&body=" + encodeURIComponent(r.body));
    $("dl_v1").hidden = true; $("dl_v2").hidden = false;
  }
  $("dl_f").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!validate()) return;
    var r = collect();
    if (FORM_ENDPOINT) {
      var btn = $("dl_f").querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = T(C.form.sending);
      fetch(FORM_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ subject: r.subject, to: MAILTO, fields: r.data, message: r.body }) })
        .then(function (res) { if (!res.ok) throw new Error("http"); showReady(r); $("dl_s2").textContent = T(C.form.sent); $("dl_pre").hidden = true; $("dl_mail").hidden = true; $("dl_copy").hidden = true; $("dl_back").hidden = true; })
        .catch(function () { showReady(r); $("dl_ok").textContent = T(C.form.failed); });
      return;
    }
    ["dl_pre", "dl_mail", "dl_copy", "dl_back"].forEach(function (id) { $(id).hidden = false; });
    showReady(r);
  });
  $("dl_copy").addEventListener("click", function () {
    var txt = $("dl_pre").textContent, ok = $("dl_ok");
    function done() { ok.textContent = T(C.form.copied) + MAILTO + "."; }
    function fallback() { var rg = document.createRange(); rg.selectNodeContents($("dl_pre")); var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg); }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });
  $("dl_back").addEventListener("click", function () { $("dl_v2").hidden = true; $("dl_v1").hidden = false; });
  $("dl_x").addEventListener("click", function () { dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) { dlg.close(); } });
  document.addEventListener("click", function (e) { var g = e.target.closest ? e.target.closest("[data-go]") : null; if (g) { var t = $(g.getAttribute("data-go")); if (t) t.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); return; } var b = e.target.closest ? e.target.closest("[data-open]") : null; if (b) openForm(b.getAttribute("data-open")); });
  $("c_cp").addEventListener("click", function () {
    var ok = $("c_ok");
    function done() { ok.textContent = T(C.cpd); }
    try { navigator.clipboard.writeText(MAILTO).then(done, function () {}); } catch (e) {}
  });

  /* parallax and scroll-linked motion */
  function scrollFx() {
    if (reduce) return;
    var vh = window.innerHeight;
    Array.prototype.forEach.call(document.querySelectorAll(".sk"), function (el) {
      var r = el.parentElement.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) return;
      var d = r.top + r.height / 2 - vh / 2;
      el.style.setProperty("--y", (-d * parseFloat(getComputedStyle(el).getPropertyValue("--sp") || 0)).toFixed(1));
      el.style.setProperty("--rr", (d * 0.012).toFixed(2));
    });
    Array.prototype.forEach.call(document.querySelectorAll(".fc"), function (el) {
      var r = el.parentElement.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) return;
      el.style.setProperty("--y", ((r.top + r.height / 2 - vh / 2) * parseFloat(el.getAttribute("data-s") || 0)).toFixed(1));
    });
    var tb = $("tband"), br = tb.getBoundingClientRect();
    if (br.bottom > 0 && br.top < vh) { var pr = (vh - br.top) / (vh + br.height); $("ttrack").style.setProperty("--tx", (-pr * 900 + 200).toFixed(1)); }
    var stk = document.querySelectorAll(".stk");
    if (window.scrollY < 900) Array.prototype.forEach.call(stk, function (el, i) { el.style.marginTop = (window.scrollY * (0.05 + i * 0.03)).toFixed(1) + "px"; });
  }

  /* language, copy, scroll */
  $("bAr").addEventListener("click", function () { lang = "ar"; render(); applyImages(); applyMail(); railLater(); });
  $("bEn").addEventListener("click", function () { lang = "en"; render(); applyImages(); applyMail(); railLater(); });
  var raf = 0;
  window.addEventListener("scroll", function () {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; var h = document.documentElement.scrollHeight - window.innerHeight; $("prog").style.transform = "scaleX(" + (h > 0 ? Math.min(1, window.scrollY / h) : 0) + ")"; railUpdate(); scrollFx(); $("hero").style.setProperty("--p", Math.min(1, window.scrollY / 700)); });
  }, { passive: true });
  var hero = $("hero");
  hero.addEventListener("pointermove", function (e) {
    if (reduce) return; var r = hero.getBoundingClientRect();
    hero.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%"); hero.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
  });

  render();
  applyImages(); applySocial(); applyMail();
  buildRail();
  if (/[?&]quote=1\b/.test(location.search)) setTimeout(function () { openForm(); }, 400);
})();
